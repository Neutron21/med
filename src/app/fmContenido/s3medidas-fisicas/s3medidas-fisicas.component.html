<div class="d-flex justify-content-between align-items-center mb-4" *ngIf="!isLoading">
  <h4 class="mb-0">Medidas Físicas y Signos Vitales</h4>
  
  <div class="d-flex flex-column align-items-end">
    <small class="text-muted update-text mb-1">
      <i class="bi bi-clock-history me-1"></i>
      Última actualización: <strong>{{ body.updated ? (body.updated | date:'dd/MM/yyyy HH:mm:ss') : 'Sin fecha registrada' }}</strong>
    </small>

  
<div class="d-flex gap-2">
  <button *ngIf="!isEditing" type="button" class="btn btn-outline-primary btn-sm" (click)="iniciarEdicion()">Editar</button>
  
  <ng-container *ngIf="isEditing">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelarEdicion()" [disabled]="isLoading">Cancelar</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="guardarCambios()" [disabled]="isLoading">
      {{ isLoading ? 'Guardando...' : 'Guardar' }}
    </button>
  </ng-container>
</div>
  </div>
</div>

<div *ngIf="isLoading" class="spinner-overlay">
  <img alt="spiner" src="../../assets/doctor.gif" class="spinner-image"/>
</div>

<div class="container px-0" *ngIf="!isLoading">
  <fieldset [disabled]="!isEditing || isSaving" class="border-0 p-0 m-0">
    <div class="row mb-3">
      <div class="col-md-3 mb-3">
        <label for="peso" class="form-label">Peso:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="peso" name="peso" [(ngModel)]="body.peso" 
          (ngModelChange)="marcarCambios()" (keypress)="onlyNumbers($event)">
          <span class="input-group-text">kg</span>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <label for="glucosa" class="form-label">Glucosa:</label>
        <input type="text" class="form-control" id="glucosa" name="glucosa" [(ngModel)]="body.glucosa" 
        (ngModelChange)="marcarCambios()" (keypress)="onlyNumbers($event)">
      </div>
      <div class="col-md-3 mb-3">
        <label for="estatura" class="form-label">Estatura:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="estatura" name="estatura" [(ngModel)]="body.estatura" 
          (ngModelChange)="marcarCambios()">
          <span class="input-group-text">cm</span>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <label for="imc" class="form-label">IMC:</label>
        <input type="text" class="form-control" id="imc" name="imc" [(ngModel)]="body.imc" (ngModelChange)="marcarCambios()">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-3 mb-3">
        <label for="temperatura" class="form-label">Temperatura:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="temperatura" name="temperatura" [(ngModel)]="body.temperatura" 
          (ngModelChange)="marcarCambios()">
          <span class="input-group-text">°C</span>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <label for="fCardiaca" class="form-label">F. Cardiaca:</label>
        <input type="text" class="form-control" id="fCardiaca" name="fCardiaca" [(ngModel)]="body.f_cardiaca" 
        (ngModelChange)="marcarCambios()">
      </div>
      <div class="col-md-3 mb-3">
        <label for="fRespiratoria" class="form-label">F. Respiratoria:</label>
        <input type="text" class="form-control" id="fRespiratoria" name="fRespiratoria" [(ngModel)]="body.f_respiratoria" 
        (ngModelChange)="marcarCambios()">
      </div>
      <div class="col-md-3 mb-3">
        <label for="tensionArterial" class="form-label">Tensión Arterial:</label>
        <input type="text" class="form-control" id="tensionArterial" name="tensionArterial" [(ngModel)]="body.tension_arterial" 
        (ngModelChange)="marcarCambios()">
      </div>
    </div>
  </fieldset>
</div>

<div class="modal fade" [class.show]="showSuccessModal" [style.display]="showSuccessModal ? 'block' : 'none'" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
    <div class="modal-content text-center p-3">
      <div class="modal-body">
        <div class="text-success mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
        </div>
        <h5 class="mb-1">¡Guardado con éxito!</h5>
        <p class="text-muted small mb-3">Tus cambios se han guardado correctamente.</p>
        <button type="button" class="btn btn-primary btn-sm w-100" (click)="cerrarModalExito()">Aceptar</button>
      </div>
    </div>
  </div>
</div>
