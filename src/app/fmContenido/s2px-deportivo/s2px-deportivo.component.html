<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
  <!-- <div class="d-flex align-items-center titulo"> -->
    <div class="d-flex align-items-center gap-3 flex-wrap">
        <h4 class="">PX Deportivo </h4>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="switchDeportivo" [(ngModel)]="formData.pacienteDeportivo">
          <label class="form-check-label" for="switchDeportivo">{{ formData.pacienteDeportivo ? 'Si' : 'No' }}</label>
        </div>
  </div>
  <div class="d-flex flex-column align-items-md-end gap-1">
    <small class="text-muted mb-1 update-text">
    <i class="bi bi-clock-history me-1"></i>
    Última actualización: <strong>{{ body.updated ? (body.updated | date:'dd/MM/yyyy HH:mm:ss') : 'Sin fecha registrada' }}</strong>
  </small>
  <div class="d-flex gap-2">
      <button *ngIf="!isEditing" type="button" class="btn btn-outline-primary btn-sm" (click)="iniciarEdicion()" [disabled]="!formData.pacienteDeportivo">
        Editar
      </button>
  <ng-container *ngIf="isEditing">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelarEdicion()" [disabled]="isLoading">Cancelar</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="guardarCambios()" [disabled]="isLoading">
      {{ isLoading ? 'Guardando...' : 'Guardar' }}
    </button>
  </ng-container>
</div>
</div>

   <div *ngIf="isLoading" class="spinner-overlay">
    <img alt="spiner" src="../../assets/doctor.gif" class="spinner-image"/>

<fieldset [disabled]="!isEditing || isSaving" class="border-0 p-0 m-0">
<div class="container">
  <div *ngIf="!isLoading">
    

    <div *ngIf="formData.pacienteDeportivo">
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="disciplina" class="form-label">Disciplina:</label>
          <input type="text" class="form-control" id="disciplina" name="disciplina" [(ngModel)]="body.disciplina" 
          (ngModelChange)="marcarCambios()" (keypress)="onlyText($event)">
        </div>
        <div class="col-md-4">
          <label for="deporteAltoRendimiento" class="form-label">Deporte de Alto Rendimiento:</label>
          <input type="text" class="form-control" id="deporteAltoRendimiento" name="deporteAltoRendimiento" [(ngModel)]="body.deporte_de_alto_rendimiento"  
          (ngModelChange)="marcarCambios()" (keypress)="onlyText($event)">
        </div>
        <div class="col-md-4">
          <label for="arteCompetitivo" class="form-label">Arte Competitivo:</label>
          <input type="text" class="form-control" id="arteCompetitivo" name="arteCompetitivo" [(ngModel)]="body.arte_competitivo"  
          (ngModelChange)="marcarCambios()" (keypress)="onlyText($event)">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="categoria" class="form-label">Categoría:</label>
          <input type="text" class="form-control" id="categoria" name="categoria" [(ngModel)]="body.categoria"  
          (ngModelChange)="marcarCambios()" (keypress)="onlyText($event)">
        </div>
        <div class="col-md-4">
          <label for="nombreEntrenador" class="form-label">Nombre del Entrenador:</label>
          <input type="text" class="form-control" id="nombreEntrenador" name="nombreEntrenador" [(ngModel)]="body.nombre_del_entrenador" 
          (ngModelChange)="marcarCambios()" (keypress)="onlyText($event)">
        </div>
        <div class="col-md-4">
          <label for="clubLiga" class="form-label">Club o Liga:</label>
          <input type="text" class="form-control" id="clubLiga" name="clubLiga" [(ngModel)]="body.club_o_liga_deportiva"  
          (ngModelChange)="marcarCambios()"  (keypress)="onlyText($event)">
        </div>
      </div>
    </div>
  </div>
</div>
</fieldset>

<div class="modal fade" [class.show]="showSuccessModal" [style.display]="showSuccessModal ? 'block' : 'none'" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
    <div class="modal-content text-center p-3">
      <div class="modal-body">
        <div class="text-success mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
        </div>
        <h5 class="mb-1">¡Guardado con éxito!</h5>
        <p class="text-muted small mb-3">Tus cambios se han guardado correctamente.</p>
        <button type="button" class="btn btn-primary btn-sm w-100" (click)="cerrarModalExito()">Aceptar</button>
      </div>
    </div>
  </div>
</div>
